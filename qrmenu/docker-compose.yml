name: qrmenu

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qrmenu
      POSTGRES_USER: qrmenu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qrmenu}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrmenu -d qrmenu"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *restart
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *restart
    build: ./backend
    environment: &api-env
      DATABASE_URL: postgresql+asyncpg://qrmenu:${POSTGRES_PASSWORD:-qrmenu}@postgres:5432/qrmenu
      REDIS_URL: redis://redis:6379/0
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://localhost}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      MEDIA_DIR: /data/media
      DEMO_DATA: ${DEMO_DATA:-false}
    volumes:
      - media:/data/media
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  web:
    <<: *restart
    build: ./frontend

  caddy:
    <<: *restart
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web

  # Daily pg_dump into the "backups" volume, 14 days kept.
  # Run one now: docker compose exec backup /backup.sh once
  backup:
    <<: *restart
    image: postgres:16-alpine
    entrypoint: ["/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: qrmenu
      PGPASSWORD: ${POSTGRES_PASSWORD:-qrmenu}
      PGDATABASE: qrmenu
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  # docker compose --profile test run --rm api-test
  api-test:
    profiles: ["test"]
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    environment:
      <<: *api-env
      MEDIA_DIR: /tmp/media
    entrypoint: []
    command: ["pytest", "-q"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  pgdata:
  media:
  backups:
  caddy_data:
  caddy_config:
